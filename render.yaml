services:
  # ─────────────────────────────────────────────────────────────
  # BACKEND
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: ai-video-assistant-backend
    runtime: docker

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: SARVAM_API_KEY
        sync: false

      - key: SARVAM_STT_MODEL
        value: saaras:v3

      - key: WHISPER_MODEL
        value: base

      - key: ALLOWED_ORIGINS
        value: https://ai-video-assistant-frontend.onrender.com


  # ─────────────────────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: ai-video-assistant-frontend
    runtime: static

    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist

    envVars:
      - key: VITE_API_URL
        value: https://ai-video-assistant-backend.onrender.com